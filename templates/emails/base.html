<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ subject|default:"Notification" }}{% endblock %}</title>
    <style>
        table { border-spacing: 0; mso-table-lspace: 0; mso-table-rspace: 0; }
        .email-content p { margin: 0 0 24px; }
        .email-content h1 { margin: 0 0 24px; font-size: 24px; line-height: 1.3; color: #111827; }
        .email-content h2 { margin: 32px 0 16px; font-size: 20px; line-height: 1.4; color: #111827; }
        .email-content img { max-width: 100%; height: auto; }
        .email-header img, .email-footer img { max-width: 100%; }
        .email-footer p { margin: 0 0 12px; }
        .email-footer a { color: #6b7280; }
        @media only screen and (max-width: 600px) {
            .email-wrapper { padding: 0 !important; }
            .email-container { width: 100% !important; border-radius: 0 !important; }
            .email-header, td.email-content, .email-footer { padding: 24px 20px !important; }
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f3f4f6; color: #1f2937; font-family: Arial, Helvetica, sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width: 100%; margin: 0; padding: 0; background-color: #f3f4f6;">
        <tr>
            <td class="email-wrapper" align="center" style="padding: 40px 20px;">
                <!--[if mso]><table role="presentation" width="600"><tr><td><![endif]-->
                <table class="email-container" role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="width: 100%; max-width:
                    600px; background-color: #ffffff; border: 1px solid #e5e7eb; border-radius: 12px;">
                    <tr>
                        <td class="email-header" style="padding: 32px 40px; border-bottom: 1px solid #e5e7eb;">
                            <img src="cid:axial-logo" alt="Axial Projects" width="160" height="50" style="display: block; width: 160px; height: 50px; max-width: 160px; border: 0; outline: none; text-decoration: none;">

                            <p style="margin: 8px 0 0; font-size: 13px; line-height: 18px; color: #6b7280;">P6 Operations Hub</p>
                        </td>
                    </tr>
                    <tr>
                        <td class="email-content" style="padding: 40px; font-size: 16px; line-height: 24px; color: #374151;">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>
                    <tr>
                        <td class="email-footer" align="center" style="padding: 32px 40px; border-top: 1px solid #e5e7eb; background-color: #f9fafb;
                            font-size: 12px; line-height: 18px; color: #6b7280;">
                            {% block footer %}{{ email_footer_content|safe }}{% endblock %}
                        </td>
                    </tr>
                </table>
                <!--[if mso]></td></tr></table><![endif]-->
            </td>
        </tr>
    </table>
</body>
</html>
