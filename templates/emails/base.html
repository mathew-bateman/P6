<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ subject|default:"Notification" }}{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow-wrap: break-word;
            word-wrap: break-word;
            -webkit-hyphens: auto;
            -ms-hyphens: auto;
            hyphens: auto;
        }

        body {
            font-family: "Montserrat", "Raleway", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.6;
            color: #1f2937;
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            width: 100%;
        }

        .email-wrapper {
            width: 100%;
            background-color: #f3f4f6;
            padding: 40px 20px;
        }

        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .email-header {
            background-color: #ffffff;
            padding: 32px 40px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: flex-start;
            flex-direction: column;
        }

        .logo {
            height: 32px;
            width: auto;
            display: block;
            max-width: 180px;
        }

        .brand-title {
            margin: 0;
            font-size: 24px;
            line-height: 1.2;
            color: #111827;
            font-weight: 700;
        }

        .email-body {
            padding: 40px;
            background-color: #ffffff;
        }

        .email-content {
            font-size: 16px;
            color: #374151;
        }

        .email-content h1 {
            font-size: 24px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 24px;
            line-height: 1.3;
        }

        .email-content h2 {
            font-size: 20px;
            font-weight: 600;
            color: #111827;
            margin: 32px 0 16px;
        }

        .email-content p {
            margin-bottom: 24px;
            color: #4b5563;
        }

        .card {
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 24px;
            margin: 24px 0;
        }

        .card-title {
            font-weight: 600;
            color: #111827;
            margin-bottom: 8px;
            display: block;
        }

        .button-container {
            text-align: center;
            margin: 32px 0;
        }

        .button {
            display: inline-block;
            background-color: #001689;
            color: #ffffff !important;
            text-decoration: none;
            padding: 12px 32px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 16px;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        .info-box {
            background-color: #eff6ff;
            border-left: 4px solid #0071ce;
            padding: 16px;
            margin: 24px 0;
            border-radius: 4px;
        }

        .info-box p {
            margin: 0;
            color: #001689;
            font-size: 14px;
        }

        .email-footer {
            background-color: #f9fafb;
            padding: 32px 40px;
            text-align: center;
            border-top: 1px solid #e5e7eb;
        }

        .footer-text {
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .text-muted {
            color: #6b7280;
        }

        .text-small {
            font-size: 14px;
        }

        @media only screen and (max-width: 600px) {
            .email-wrapper {
                padding: 0;
            }

            .email-container {
                border-radius: 0;
                width: 100% !important;
            }

            .email-header,
            .email-body,
            .email-footer {
                padding: 24px 20px;
            }

            .button {
                display: block;
                width: 100%;
            }
        }

        .email-content img {
            max-width: 100%;
            height: auto;
        }

        .email-header img,
        .email-footer img {
            max-width: 100%;
        }
    </style>
</head>
<body>
    <div class="email-wrapper">
        <div class="email-container">
            <div class="email-header">
                {% if email_header_content %}
                    {{ email_header_content|safe }}
                {% elif logo_url %}
                    <img src="{{ logo_url }}"
                         alt="Logo"
                         class="logo"
                         height="32"
                         style="display: block; border: 0; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic; height: 32px; width: auto; max-width: 180px;">
                {% else %}
                    <h1 class="brand-title">{{ company_name|default:"Axial Projects" }}</h1>
                {% endif %}
            </div>

            <div class="email-body">
                <div class="email-content">
                    {% block content %}{% endblock %}
                </div>
            </div>

            <div class="email-footer">
                {% block footer %}
                    {% if email_footer_content %}
                        <div class="footer-text">
                            {{ email_footer_content|safe }}
                        </div>
                    {% endif %}
                {% endblock %}
            </div>
        </div>
    </div>
</body>
</html>
